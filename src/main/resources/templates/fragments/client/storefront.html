<div xmlns:th="http://www.thymeleaf.org" th:fragment="storefront">
  <div class="flex flex-wrap items-center gap-3 justify-between">
    <p class="ok">Shopping as <b th:text="${client.name}">Client</b> · <span th:text="${client.email}">email</span></p>
    <button class="btn btn-ghost" hx-delete="/fragments/client/session-client" hx-target="#client-panel"
      hx-swap="innerHTML">Reset client</button>
  </div>

  <div class="card mt-4">
    <div class="flex items-center justify-between">
      <h2 class="font-bold">My orders</h2>
      <button class="btn btn-ghost !p-2" hx-get="/fragments/client/orders" hx-target="#my-orders"
        hx-swap="innerHTML"><img th:src="@{/img/refresh-sign.svg}" src="/img/refresh-sign.svg"
          alt="Product image placeholder" width="22" height="22" /></button>
    </div>
    <div id="my-orders" hx-get="/fragments/client/orders" hx-trigger="load" hx-swap="innerHTML" class="mt-2">
      <div th:replace="~{fragments/client/my-orders :: list}"></div>
    </div>
  </div>

  <div class="grid md:grid-cols-3 gap-4 mt-4">
    <div class="md:col-span-2 card">
      <div class="flex items-center justify-between gap-2">
        <h2 class="font-bold">Catalog</h2>
        <form hx-get="/fragments/client/products" hx-target="#catalog" hx-swap="innerHTML" class="flex gap-2">
          <select class="input" name="categoryId" onchange="this.form.requestSubmit()">
            <option value="">All categories</option>
            <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}">Cat</option>
          </select>
        </form>
      </div>
      <div id="catalog" class="mt-3">
        <div th:replace="~{fragments/client/product-cards :: cards}"></div>
      </div>
    </div>

    <div class="card">
      <h2 class="font-bold">Cart → new order</h2>
      <div id="cart-items" class="grid gap-2 mt-6">
        <p class="text-sm text-slate-400" data-cart-empty>Cart is empty — add products from the catalog.</p>
      </div>
      <p id="cart-total" class="font-bold mt-2" hidden>Cart total: $<span data-cart-total>0.00</span></p>
      <form id="cart-form" hx-post="/fragments/client/orders" hx-target="#order-result" hx-swap="innerHTML"
        action="/fragments/client/orders" method="post" class="my-6 pt-4 border-t-1 border-slate-800">
        <div id="cart-hidden-inputs"></div>
        <button id="cart-place" class="btn btn-primary w-full" type="submit" disabled>Place order</button>
      </form>
      <div id="order-result" class="toast mt-3" title="Click to dismiss"></div>
    </div>
  </div>
  <div id="order-modal" data-modal-mount></div>
</div>
