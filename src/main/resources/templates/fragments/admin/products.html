<div xmlns:th="http://www.thymeleaf.org" th:fragment="panel">
  <div class="card">
    <h2 class="font-bold">New product</h2>
    <form class="grid sm:grid-cols-2 gap-2 mt-2" hx-post="/fragments/admin/products" hx-target="#admin-panel" hx-swap="innerHTML">
      <input class="input sm:col-span-2" name="name" placeholder="Name *" required/>
      <input class="input" name="price" type="number" step="0.01" min="0" placeholder="Price *" required/>
      <select class="input" data-cat-select>
        <option value="">Add a category…</option>
        <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}">Cat</option>
      </select>
      <input class="input sm:col-span-2" name="description" placeholder="Description"/>
      <input class="input sm:col-span-2" placeholder="Image URL — managed by seed data (soon)" disabled/>
      <div class="sm:col-span-2 flex flex-wrap gap-2 text-xs" data-cat-chips>
        <span class="text-slate-500" data-cat-empty>No categories chosen.</span>
      </div>
      <button class="btn btn-primary sm:col-span-2" type="submit">Create product</button>
    </form>
  </div>
  <div class="card mt-3">
    <h2 class="font-bold">Products</h2>
    <table class="tbl mt-2">
      <thead><tr><th>#</th><th>Name</th><th>Price</th><th>Categories</th><th></th><th></th></tr></thead>
      <tbody>
      <tr th:each="p : ${products}">
        <td th:text="${p.id}">1</td>
        <td th:text="${p.name}">n</td>
        <td th:text="${#numbers.formatDecimal(p.price, 1, 2)}">0.00</td>
        <td><span th:each="c : ${p.categories}" th:text="${c.name} + ' '" class="text-slate-400">c</span></td>
        <td><button class="btn btn-ghost" th:hx-get="@{'/fragments/admin/products/' + ${p.id} + '/edit'}" hx-target="#admin-modal" hx-swap="innerHTML">Edit</button></td>
        <td><button class="btn btn-danger" th:hx-delete="@{'/fragments/admin/products/' + ${p.id}}" hx-target="#admin-panel" hx-swap="innerHTML" hx-confirm="Delete product?">Delete</button></td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
