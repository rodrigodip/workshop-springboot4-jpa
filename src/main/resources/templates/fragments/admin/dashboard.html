<div xmlns:th="http://www.thymeleaf.org" th:fragment="panel">
  <div class="grid sm:grid-cols-4 gap-3">
    <div class="card"><p class="text-xs text-slate-400">Clients</p><p class="text-2xl font-bold" th:text="${userCount}">0</p></div>
    <div class="card"><p class="text-xs text-slate-400">Products</p><p class="text-2xl font-bold" th:text="${productCount}">0</p></div>
    <div class="card"><p class="text-xs text-slate-400">Orders</p><p class="text-2xl font-bold" th:text="${orderCount}">0</p></div>
    <div class="card"><p class="text-xs text-slate-400">Revenue</p><p class="text-2xl font-bold">$<span th:text="${#numbers.formatDecimal(revenue, 1, 2)}">0.00</span></p></div>
  </div>
</div>
