<div xmlns:th="http://www.thymeleaf.org" th:fragment="panel">
  <div class="card">
    <h2 class="font-bold">New client</h2>
    <form class="grid sm:grid-cols-2 gap-2 mt-2" hx-post="/fragments/admin/users" hx-target="#admin-panel" hx-swap="innerHTML">
      <input class="input" name="name" placeholder="Name *" required/>
      <input class="input" name="email" type="email" placeholder="Email *" required/>
      <input class="input" name="phone" placeholder="Phone (digits only) *" required
             inputmode="numeric" pattern="[0-9]{8,15}" title="Digits only, 8–15 characters"/>
      <input class="input" name="password" type="password" minlength="4" placeholder="Password *" required/>
      <button class="btn btn-primary sm:col-span-2" type="submit">Create client</button>
    </form>
  </div>
  <div class="card mt-3">
    <h2 class="font-bold">Clients</h2>
    <table class="tbl">
      <thead><tr><th>#</th><th>Name</th><th>Email</th><th>Phone</th><th></th><th></th></tr></thead>
      <tbody>
      <tr th:each="u : ${users}">
        <td th:text="${u.id}">1</td><td th:text="${u.name}">n</td>
        <td th:text="${u.email}">e</td><td th:text="${u.phone}">p</td>
        <td><button class="btn btn-ghost" th:hx-get="@{'/fragments/admin/users/' + ${u.id} + '/edit'}" hx-target="#admin-modal" hx-swap="innerHTML">Edit</button></td>
        <td><button class="btn btn-danger" th:hx-delete="@{'/fragments/admin/users/' + ${u.id}}" hx-target="#admin-panel" hx-swap="innerHTML" hx-confirm="Delete client?">Delete</button></td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
